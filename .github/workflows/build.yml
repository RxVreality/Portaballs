name: build

# Every push: run the maths and helper tests and build the helper. None of it needs s&box or a headset.
# The s&box game code itself is compiled by the engine on the player's PC, so it is not built here.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Maths tests
        shell: pwsh
        run: |
          foreach ($t in 'Throwing', 'Paint', 'Portals', 'Link') {
            dotnet test "core/tests/$t.Tests/$t.Tests.csproj" --nologo -v q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Helper tests
        shell: pwsh
        run: dotnet test helper/tests/Helper.Tests/Helper.Tests.csproj -c Release --nologo -v q

      - name: Build the helper
        shell: pwsh
        run: dotnet publish helper/app/PortaballsHelper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist/helper --nologo -v q

      - uses: actions/upload-artifact@v4
        with:
          name: helper
          path: dist/helper
